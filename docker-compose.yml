services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fin-flower-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # A API só deve subir depois que o banco aceitar conexão de verdade.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
    container_name: fin-flower-api
    depends_on:
      sqlserver:
        # Sem esta condição a API tentaria conectar antes do banco aceitar.
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Dentro da rede do compose o host do banco é o nome do serviço.
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=FinFlower;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?defina JWT_SIGNING_KEY no .env}
      # Não há quem rode Update-Database aqui: a aplicação aplica as migrations.
      Database__MigrateOnStartup: "true"
      # Origem do front — o navegador chama a API pela porta publicada no host.
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "5212:8080"

volumes:
  sqlserver-data:
